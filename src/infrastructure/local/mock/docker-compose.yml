services:
  mock-proxy-basic:
    image: stoplight/prism:5
    command: mock --multiprocess=false -h 0.0.0.0 -p 4010 /api/src/interfaces/ncpeh-proxy/http-proxy/I_HTTP-Proxy_basic.yaml
    volumes:
      - ../../../..:/api
    ports:
      - "4010:4010"

  mock-ism-service:
    image: stoplight/prism:5
    command: mock --multiprocess=false -h 0.0.0.0 -p 4011 /api/src/interfaces/ncpeh-proxy/http-proxy/I_ISM_Service.yaml
    volumes:
      - ../../../..:/api
    ports:
      - "4011:4011"

  mock-ism-fd:
    image: stoplight/prism:5
    command: mock --multiprocess=false -h 0.0.0.0 -p 4012 /api/src/interfaces/ncpeh-fd/I_ISM_Service_FD.yaml
    volumes:
      - ../../../..:/api
    ports:
      - "4012:4012"

  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-proxy-basic
      - mock-ism-service
      - mock-ism-fd
