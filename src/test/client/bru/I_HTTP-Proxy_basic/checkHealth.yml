info:
  name: checkHealth
  type: http
  seq: 1
http:
  method: GET
  url: '{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/health'
  headers:
  - name: x-useragent
    value: '{{process.env.USER_AGENT}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  - expression: res.status
    operator: neq
    value: '500'
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
examples:
- name: res-200
  request:
    url: '{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/health'
    method: GET
    headers:
    - name: x-useragent
      value: '{{process.env.USER_AGENT}}'
  response:
    status: 200
    statusText: OK
    body:
      type: text
      data: "{\n  \"status\": \"UP\"\n}"
