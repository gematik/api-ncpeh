info:
  name: notifyWebAppBuild
  type: http
  seq: 1

http:
  method: POST
  url: "{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/events/app/build"
  headers:
    - name: x-useragent
      value: "{{process.env.USER_AGENT}}"
    - name: XXXXX-API-KEY
      value: "{{process.env.PROXY_API_KEY}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"
    - expression: res.status
      operator: neq
      value: "401"
    - expression: res.status
      operator: neq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: res-202
    request:
      url: "{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/events/app/build"
      method: POST
      headers:
        - name: x-useragent
          value: "{{process.env.USER_AGENT}}"
        - name: XXXXX-API-KEY
          value: "{{process.env.PROXY_API_KEY}}"
    response:
      status: 202
      statusText: OK
