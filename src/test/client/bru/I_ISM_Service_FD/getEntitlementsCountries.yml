info:
  name: getEntitlementsCountries
  type: http
  seq: 2

http:
  method: GET
  url: "{{process.env.API_GATEWAY_URL}}/ncpeh-fd/api/v1/entitlements/countries?version={{version}}"
  headers:
    - name: x-useragent
      value: "{{process.env.USER_AGENT}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.CountryApplicationAuthorizations
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Abruf der Länder-Berechtigungen (AllowedList) vom NCPeH-FD.
