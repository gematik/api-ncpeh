info:
  name: getIsmHtml
  type: http
  seq: 1

http:
  method: GET
  url: "{{process.env.API_GATEWAY_URL}}/http-proxy/api/v1/ism"
  headers:
    - name: x-useragent
      value: "{{process.env.USER_AGENT}}"
    - name: XXXXX-API-KEY
      value: "{{process.env.API_KEY}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.ISMInternationalHtml
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Abruf der ISM-HTML-Liste.
  Beispieldaten: example-data/I_ISM_Service-getIsmHtml-res-001.json
