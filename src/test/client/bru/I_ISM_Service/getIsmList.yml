info:
  name: getIsmList
  type: http
  seq: 1

http:
  method: GET
  url: "{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/ismlist"
  headers:
    - name: x-useragent
      value: "{{process.env.USER_AGENT}}"
    - name: XXXXX-API-KEY
      value: "{{process.env.PROXY_API_KEY}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.status
      operator: neq
      value: "404"
    - expression: res.status
      operator: neq
      value: "406"
    - expression: res.status
      operator: neq
      value: "500"
    - expression: res.body.ISMInternational
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: res-200
    request:
      url: "{{process.env.protocol}}://{{process.env.hostname}}/{{process.env.basepath_proxy}}/{{process.env.apipath}}/{{process.env.apiversion}}/ismlist"
      method: GET
      headers:
        - name: x-useragent
          value: "{{process.env.USER_AGENT}}"
        - name: XXXXX-API-KEY
          value: "{{process.env.PROXY_API_KEY}}"
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "ISMInternational": [
              {
                "CountryCode": "PT",
                "ISM": "PHhtbD48ZmllbGQ+cGF0aWVudElkPC9maWVsZD48L3htbD4="
              }
            ]
          }
