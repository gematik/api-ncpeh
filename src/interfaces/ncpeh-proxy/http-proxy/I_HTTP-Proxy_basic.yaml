openapi: 3.1.0
info:
  title: allgemeine HTTP-Proxy Interfaces (NCPeH-Proxy)
  version: 1.0.0
  description: OpenAPI 3 Beschreibung für allgemeine Schnittstellen am HTTP-Proxy des NCPeH-Proxy
servers:
  - url: "{protocol}://{hostname}/{basepath}/{apipath}/{apiversion}"
    variables:
      protocol:
        default: https
      hostname:
        default: "dummyhostname:443"
      basepath:
        default: "http-proxy"
      apipath:
        default: "api"
      apiversion:
        default: "v1"
    description: HTTP-Proxy API des NCPeH-Proxy (Version 1)

components:
  parameters:
    x-useragent:
      name: x-useragent
      in: header
      description: Identifiziert den aufrufenden Client zur Nachverfolgbarkeit.
      required: false
      schema:
        type: string
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS für die Absicherung der internen Kommunikation.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: XXXXX-API-KEY
      description: API-Key für den internen Dienstzugriff.
security:
  - mTLS: []
paths:
  /health:
    get:
      tags:
        - Common
      summary: Health Check
      description: Überprüft den Status (Readiness/Liveness) des Proxy-Dienstes.
      operationId: checkHealth
      parameters:
        - $ref: '#/components/parameters/x-useragent'
      responses:
        '200':
          description: Dienst ist erreichbar und bereit
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"
        '500':
          description: Dienst ist nicht verfügbar

webhooks:
  events/app/build:
    post:
      tags:
        - Common
        - UC_ISM_bereitstellen
      summary: WebApp-Build triggern
      description: Webhook, der vom Proxy aufgerufen wird, um den Buildprozess der WebApp anzustoßen.
      operationId: triggerWebAppBuild
      parameters:
        - $ref: '#/components/parameters/x-useragent'
      security:
        - mTLS: []
        - ApiKeyAuth: []
      responses:
        '202':
          description: Build-Prozess erfolgreich angestoßen
        '401':
          description: Fehlende oder ungültige Authentifizierung
        '403':
          description: Zugriff verweigert