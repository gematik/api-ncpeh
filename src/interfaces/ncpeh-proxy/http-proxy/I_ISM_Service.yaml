openapi: 3.1.0
info:
  title: HTTP-Proxy Interfaces für die Bereitstellung von ISMs
  version: 1.0.0
  description: OpenAPI 3 Beschreibung für ISM-bezogene Schnittstellen am HTTP-Proxy des NCPeH-Proxy
servers:
  - url: "{protocol}://{hostname}/{basepath}/{apipath}/{apiversion}"
    variables:
      protocol:
        default: https
      hostname:
        default: "dummyhostname:443"
      basepath:
        default: "http-proxy"
      apipath:
        default: "api"
      apiversion:
        default: "v1"
    description: HTTP-Proxy API des NCPeH-Proxy (Version 1)

components:
  parameters:
    x-useragent:
      name: x-useragent
      in: header
      description: Identifiziert den aufrufenden Client zur Nachverfolgbarkeit.
      required: false
      schema:
        type: string
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS für die Absicherung der internen Kommunikation.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: XXXXX-API-KEY
      description: API-Key für den internen Dienstzugriff.

security:
  - mTLS: []

paths:
  /ism:
    get:
      tags:
        - UC_ISM_bereitstellen
        - I_ISM_Service
      summary: Bereitstellung der ISM-HTML-Ansichten
      description: Statische Bereitstellung der International Search Masks in HTML-Format für den Buildprozess der WebApp.
      operationId: getIsmHtml
      parameters:
        - $ref: '#/components/parameters/x-useragent'
      security:
        - mTLS: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Erfolgreicher Abruf der ISM-HTML-Liste
          content:
            application/json:
              schema:
                $ref: '../../../domain/domainobj-eped-b.yaml#/components/schemas/ISMInternationalHtmlList'
            text/html:
              schema:
                type: string
                contentMediaType: text/html
        '500':
          description: Interner Serverfehler (z.B. Fehler beim Abruf oder Rendering)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal Server Error"

  /events/ism/update:
    post:
      tags:
        - Webhooks
        - Events
        - UC_ISM_bereitstellen
        - I_ISM_Service
      summary: Benachrichtigung über aktualisierte ISM-Daten
      description: Endpoint, um den Proxy über neue ISMs aus ServiceMetadata zu informieren.
      operationId: notifyIsmUpdate
      parameters:
        - $ref: '#/components/parameters/x-useragent'
      security:
        - mTLS: []
      responses:
        '202':
          description: Benachrichtigung akzeptiert, Verarbeitung gestartet
        '401':
          description: Fehlende oder ungültige Authentifizierung
