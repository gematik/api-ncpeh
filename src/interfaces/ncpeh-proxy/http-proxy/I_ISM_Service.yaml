openapi: 3.1.0
info:
  title: HTTP-Proxy Interfaces für die Bereitstellung von ISMs
  version: 1.0.0
  description: OpenAPI 3 Beschreibung für ISM-bezogene Schnittstellen am HTTP-Proxy
    des NCPeH-Proxy
servers:
- url: '{protocol}://{hostname}/{basepath}/{apipath}/{apiversion}'
  variables:
    protocol:
      default: http
    hostname:
      default: localhost:8080
    basepath:
      default: http-proxy
    apipath:
      default: api
    apiversion:
      default: v1
  description: HTTP-Proxy API des NCPeH-Proxy (Version 1)
components:
  parameters:
    x-useragent:
      name: x-useragent
      in: header
      description: Identifiziert den aufrufenden Client zur Nachverfolgbarkeit.
      required: false
      schema:
        type: string

  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS für die Absicherung der internen Kommunikation.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: XXXXX-API-KEY
      description: API-Key für den internen Dienstzugriff.
security:
- mTLS: []
- ApiKeyAuth: []

paths:
  /events/ism/update:
    post:
      tags:
      - Webhooks
      - Events
      - UC_ISM_bereitstellen
      - I_ISM_Service
      summary: Benachrichtigung über aktualisierte ISM-Daten
      description: Endpoint, um den Proxy über neue ISMs aus ServiceMetadata zu informieren.
      operationId: notifyIsmUpdate
      parameters:
      - $ref: '#/components/parameters/x-useragent'
      security:
      - mTLS: []
      - ApiKeyAuth: []
      responses:
        '202':
          description: Benachrichtigung akzeptiert, Verarbeitung gestartet
        '401':
          description: Fehlende oder ungültige Authentifizierung

  /ismlist:
    get:
      tags:
        - ISM_Resources
        - UC_ISM_bereitstellen
        - I_ISM_Service
        - forward-to-ncpeh-fd
      summary: Abruf der aktuellen ISM-Liste
      description: Stellt die aktuellen International Search Masks als Liste zur Verfügung (gekapselt in ein FHIR-Bundle).
      operationId: getIsmList
      parameters:
        - $ref: '#/components/parameters/x-useragent'
      security:
        - mTLS: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Erfolgreicher Abruf der ISM-Liste
          content:
            application/fhir+json:
              schema:
                $ref: '../../../domain/domainobj-eped-b.yaml#/components/schemas/ISMInternationalList'
            application/fhir+xml:
              schema:
                type: string
                contentMediaType: application/fhir+xml
        '404':
          description: ISM-Dateien wurden nicht gefunden
        '406':
          description: Angefragter Mime-Type im Accept-Header kann nicht bedient werden
        '408':
          description: Anfrage hat zu lange gedauert (Timeout)
        '429':
          description: Zu viele Anfragen pro Zeiteinheit
        '500':
          description: Interner Serverfehler beim Bereitstellen der ISM-Liste
