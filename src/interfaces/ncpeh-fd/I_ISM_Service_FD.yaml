openapi: 3.1.0
info:
  title: NCPeH-FD Interfaces für die Bereitstellung von ISMs
  version: 1.0.0
  description: OpenAPI 3 Beschreibung für ISM-bezogene Schnittstellen am NCPeH-FD.
servers:
  - url: "{protocol}://{hostname}/{basepath}/{apipath}/{apiversion}"
    variables:
      protocol:
        default: http
      hostname:
        default: "localhost:8080"
      basepath:
        default: "ncpeh-fd"
      apipath:
        default: "api"
      apiversion:
        default: "v1"
    description: NCPeH-FD API (Version 1)

components:
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS für die Absicherung der internen Kommunikation.
security:
  - mTLS: []
paths:
  /ismlist:
    get:
      tags:
        - ISM_Resources
        - UC_ISM_bereitstellen
        - I_ISM_Service
      summary: Abruf der aktuellen ISM-Liste
      description: Stellt die aktuellen International Search Masks als Liste zur Verfügung (gekapselt in ein FHIR-Bundle).
      operationId: getIsmList
      security:
        - mTLS: []
      responses:
        '200':
          description: Erfolgreicher Abruf der ISM-Liste
          content:
            application/fhir+json:
              schema:
                $ref: '../../domain/domainobj-eped-b.yaml#/components/schemas/ISMInternationalList'
            application/fhir+xml:
              schema:
                type: string
                contentMediaType: application/fhir+xml
        '404':
          description: ISM-Dateien wurden nicht gefunden
        '406':
          description: Angefragter Mime-Type im Accept-Header kann nicht bedient werden
        '408':
          description: Anfrage hat zu lange gedauert (Timeout)
        '429':
          description: Zu viele Anfragen pro Zeiteinheit
        '500':
          description: Interner Serverfehler beim Bereitstellen der ISM-Liste

  /entitlements/countries:
    get:
      tags:
        - ISM_Resources
        - UC_ISM_bereitstellen
        - I_ISM_Service
      summary: Abruf der Länder-Berechtigungen (AllowedList)
      description: Liefert eine Liste der erlaubten LOINC- und PractitionerRole-Codes pro Land.
      operationId: getEntitlementsCountries
      security:
        - mTLS: []
      responses:
        '200':
          description: Erfolgreicher Abruf der Berechtigungsliste
          content:
            application/json:
              schema:
                $ref: '../../domain/domainobj-eped-b.yaml#/components/schemas/CountryApplicationAuthorizationList'
        '400':
          description: Ungültige Parameter (z.B. falsches Versionsformat)
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Angefragte Version der Liste nicht gefunden
          content:
            application/problem+json:
              schema:
                type: object
        '406':
          description: Angefragter Mime-Type im Accept-Header kann nicht bedient werden
          content:
            application/problem+json:
              schema:
                type: object
        '500':
          description: Interner Serverfehler
          content:
            application/problem+json:
              schema:
                type: object
